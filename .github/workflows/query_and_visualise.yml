name: Query and Visualise Data

on:
  #schedule:
  #  - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual triggers

jobs:
  query-and-visualise:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2 pandas plotly

      # Step 4: Run the query script
      - name: Run Query Script
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          CSV_OUTPUT_PATH: data/latest_data.csv
        run: python query_db.py

      # Step 5: Run the visualisation script
      - name: Run Visualisation Script
        env:
          CSV_OUTPUT_PATH: data/latest_data.csv
          VISUAL_OUTPUT_PATH: visualisations/latest_visualisation.html
        run: python visualisation.py

      # Step 6: Commit and push visualisation
      - name: Commit and Push Visualisation
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add visualisations/latest_visualisation.html
          git commit -m "Update visualisation"
          git push
